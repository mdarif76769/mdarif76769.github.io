name: Auto Sync Data

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          
      - name: Verify Setup
        run: echo "Repository is synchronized securely using GitHub Secrets."
