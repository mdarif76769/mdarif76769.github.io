name: Sync RMS Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create data.js with new entries
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p data
          
          # ✅ এখানে আপনার data merge করতে পারেন
          # Local browser থেকে আসা data এখানে process হবে
          
          cat > data/data.js <<'EOF'
          const savedData = [];
          EOF

      - name: Configure git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add data/data.js
            git commit -m "🔄 Auto sync RMS data via GitHub Actions"
            git push
          else
            echo "No changes to commit"
          fi
